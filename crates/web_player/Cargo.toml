[package]
name = "aurora-web-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"

# Standalone groundwork crate. The parent workspace adds this package when the
# browser shell is wired into the release pipeline; until then it keeps its own
# explicit dependency versions so it can be inspected independently.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/mod.rs"

[dependencies]
engine_core = { path = "../engine_core" }
wgpu = "=29.0.4"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = [
  "console",
  "HtmlCanvasElement",
  "Response",
  "Window",
] }
