/*
 * Aurora Android shell (unverified: no SDK/NDK or device was available here).
 *
 * Gradle assembles a debug APK from the prebuilt cdylib in jniLibs/arm64-v8a.
 * The container builder does not use Gradle: it drives aapt2/zipalign/apksigner
 * directly so the image never needs to download a Gradle distribution.
 */
plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'dev.aurora.player'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'dev.aurora.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['jniLibs']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}
