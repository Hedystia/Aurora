[workspace]
resolver = "2"

members = [
  "crates/engine_core",
  "crates/player",
  "crates/editor",
  "crates/codegen",
  "crates/script_api",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"

[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
script_api = { path = "crates/script_api" }
ab_glyph = "=0.2.32"
anyhow = "=1.0.104"
base64 = "=0.22.1"
bincode = "=2.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
clap = { version = "=4.5.60", features = ["derive"] }
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "=0.35.0"
egui_dock = { version = "=0.20.1", features = ["serde"] }
epaint_default_fonts = "=0.35.0"
glam = "=0.33.12"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }
hecs = "=0.11.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
insta = "=1.43.2"
kira = { version = "=0.12.6", default-features = false, features = ["cpal", "wav", "pcm", "mp3"] }
memmap2 = "=0.9.12"
nix = { version = "=0.30.1", features = ["fs", "socket", "signal"] }
notify = "=8.1.0"
oxijolt = "=0.6.0"
pollster = "=0.4.0"
rapier2d = { version = "=0.35.3", features = ["enhanced-determinism"] }
rapier3d = { version = "=0.35.3", features = ["enhanced-determinism"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tree-sitter = "=0.27.2"
tree-sitter-typescript = "=0.23.2"
wgpu = "=29.0.4"
winit = "=0.30.13"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
