[workspace]
resolver = "3"
members = ["crates/engine_core", "crates/script_api", "crates/player", "crates/editor", "crates/codegen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
wgpu = "=29.0.4"
egui = "=0.35.0"
egui-wgpu = "=0.35.0"
egui-winit = "=0.35.0"
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_dock = "=0.20.1"
winit = "=0.30.13"
hecs = "=0.11.2"
rapier2d = { version = "=0.35.3", features = ["simd-stable"] }
rapier3d = { version = "=0.35.3", features = ["simd-stable"] }
oxijolt = "=0.6.0"
kira = "=0.12.6"
ab_glyph = "=0.2.32"
glyphon = "=0.11.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "mp3", "pcm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
bincode = "=2.0.1"
libloading = "=0.9.0"
nix = { version = "=0.30.1", features = ["fs", "socket", "signal"] }
memmap2 = "=0.9.10"
anyhow = "=1.0.104"
thiserror = "=2.0.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
crossbeam-channel = "=0.5.15"
rayon = "=1.10.0"
clap = { version = "=4.5.60", features = ["derive"] }
notify = "=8.1.0"
proptest = "=1.7.0"
criterion = "=0.7.0"
insta = "=1.43.2"
pollster = "=0.4.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
